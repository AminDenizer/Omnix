name: Build and Release Omnix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'Omnix v1.0.0 — Electronic Inventory, Altium BOM Auditor & Multi-Vendor Procurement Engine'
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pytest openpyxl reportlab cryptography arabic_reshaper python-bidi

      - name: Run PyTest Test Suite
        run: |
          python -m pytest -v

      - name: Build Standalone Executable (PyInstaller)
        run: |
          python -m PyInstaller Omnix.spec

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.release_tag }}" }
          $zipName = "Omnix-$ver-Windows-x64.zip"

          # Create distribution package folder
          New-Item -ItemType Directory -Force -Path "Omnix-Release" | Out-Null
          Copy-Item -Path "dist/Omnix.exe" -Destination "Omnix-Release/Omnix.exe"
          Copy-Item -Path "README.md" -Destination "Omnix-Release/README.md"

          # Include signed Lion vendor plugin package
          if (Test-Path "vendors/lion.xpl") {
              New-Item -ItemType Directory -Force -Path "Omnix-Release/vendors" | Out-Null
              Copy-Item -Path "vendors/lion.xpl" -Destination "Omnix-Release/vendors/lion.xpl"
          }

          if (Test-Path "data/starter_backup.obk") {
              New-Item -ItemType Directory -Force -Path "Omnix-Release/data" | Out-Null
              Copy-Item -Path "data/starter_backup.obk" -Destination "Omnix-Release/data/starter_backup.obk"
          }

          Compress-Archive -Path "Omnix-Release/*" -DestinationPath $zipName -Force
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: ${{ github.ref_type == 'tag' && format('Omnix {0} — Electronic Inventory, Altium BOM Auditor & Procurement Engine', github.ref_name) || inputs.release_name }}
          draft: ${{ inputs.is_draft || false }}
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            dist/Omnix.exe
            vendors/lion.xpl
          body: |
            ## Omnix v1.0.0 — Official Production Release (Mode A)

            We are pleased to announce the official **v1.0.0** production release of **Omnix** — an enterprise-grade desktop workstation engineered for electronic warehouse management, Altium Designer BOM auditing, matrix label printing, and multi-vendor procurement automation.

            ---

            ### 🚀 What's New & Highlights

            #### 1. Database-Aware Warehouse Inventory (Mode A)
            - **ACID-Compliant SQLite Core**: Seamless local inventory operations with zero-lag search across Part Names, Part Numbers, Descriptions, and Footprints.
            - **Multi-Drawer Bin Tracking**: Assign and deduct stock across individual drawer bins with smart picking allocation.
            - **Encrypted Backups & Merging**: Backup and restore `.obk` archives with cryptographic integrity checks, alongside interactive database merge tools.

            #### 2. Altium Designer BOM Assembly Auditor
            - **Multi-Board Scaling**: Automatic shortage calculation scaled by batch board multipliers.
            - **Printable Assembly Worksheets**: Export clean, structured assembly sheets directly to A4 and A5 Landscape PDF.

            #### 3. Matrix Component Label Printing Engine
            - **Scissors Cut Guidelines**: Formatted with standard `✂ - - - -` dashed borders for fast manual cutting.
            - **Black & White Optimization**: Pure high-contrast typography and clear borders designed specifically for standard laser and thermal printers without color tint issues.

            #### 4. Decoupled Multi-Vendor Procurement & Plugins
            - **Signed XPL Plugins**: Standalone modular packages cryptographically verified via Ed25519 digital signatures (`vendors/lion.xpl` included).
            - **Automated Cart Placement**: Intelligent packaging step rounding (MOQ), live PDP inspection, and fail-closed cart synchronization for **Lion Electronic**, **Javan**, and **RoboEq**.

            #### 5. Quality & Stability
            - **1,284 Passed Automated Tests**: 100% test pass rate across 78 test suites.
            - **Standalone Windows Executable**: Portable single-binary distribution (`Omnix.exe`) bundled with native dark theme and all core assets.

            ---

            ### 📦 Included Release Assets
            - **`Omnix-v1.0.0-Windows-x64.zip`**: Complete portable bundle containing `Omnix.exe`, `vendors/lion.xpl`, starter backup, and documentation.
            - **`Omnix.exe`**: Portable standalone executable for 64-bit Windows.
            - **`lion.xpl`**: Officially signed Lion Electronic vendor plugin package.
